<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典棋盘对战 - 游戏入口</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", SimHei, sans-serif;
        }
        body {
            min-height: 100vh;
            /* 棋盘格子背景 */
            background-image: 
                linear-gradient(#995522 1px, transparent 1px),
                linear-gradient(90deg, #995522 1px, transparent 1px);
            background-size: 60px 60px;
            background-color: #2c1810;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        /* 全局光影浮动特效 */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(rgba(222,170,80,0.25),transparent 70%);
            animation: lightMove 8s ease-in-out infinite alternate;
            z-index: 1;
        }
        @keyframes lightMove {
            0%{transform: translate(-150px,-100px);}
            100%{transform: translate(150px,100px);}
        }
        .wrap {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 60px 40px;
            background: linear-gradient(145deg, #3d261b, #25150e);
            border: 3px solid #c89648;
            border-radius: 16px;
            box-shadow: 
                0 0 35px rgba(212,158,68,0.4),
                inset 0 0 25px rgba(139,88,38,0.35);
        }
        h1 {
            font-size: 42px;
            color: #ffdd99;
            text-shadow: 0 0 12px #e6a846, 2px 2px 4px #000;
            margin-bottom: 12px;
            letter-spacing: 4px;
        }
        .desc {
            color: #d9c29c;
            font-size:18px;
            margin-bottom:45px;
            line-height:1.7;
        }
        /* 开始游戏按钮 棋盘炫酷样式 */
        .start-btn {
            display: inline-block;
            padding: 18px 65px;
            font-size:24px;
            font-weight:bold;
            color:#1a0f09;
            background: linear-gradient(180deg,#e9b860,#b97f32);
            text-decoration:none;
            border:2px solid #ffdd99;
            border-radius:8px;
            box-shadow: 0 6px 0 #774a1e, 0 0 22px rgba(233,184,96,0.55);
            transition: all 0.2s ease;
            letter-spacing:2px;
        }
        .start-btn:hover {
            transform: translateY(-4px);
            box-shadow:0 9px 0 #774a1e,0 0 32px rgba(233,184,96,0.75);
            background: linear-gradient(180deg,#ffd275,#d49038);
        }
        .start-btn:active {
            transform: translateY(3px);
            box-shadow:0 2px 0 #774a1e;
        }
        /* 角落棋子装饰 */
        .piece {
            position:absolute;
            width:45px;
            height:45px;
            border-radius:50%;
            background:radial-gradient(#e2b259,#804c1c);
            border:2px solid #ffdd99;
            box-shadow:0 0 10px #d8a045;
        }
        .p1{top:25px;left:25px;}
        .p2{top:25px;right:25px;}
        .p3{bottom:25px;left:25px;}
        .p4{bottom:25px;right:25px;}
    </style>
</head>
<body>
    <div class="wrap">
        <!-- 四角装饰棋子 -->
        <div class="piece p1"></div>
        <div class="piece p2"></div>
        <div class="piece p3"></div>
        <div class="piece p4"></div>

        <h1>棋盘对战乐园</h1>
        <p class="desc">经典棋牌在线对局 · 实时联机对战<br>点击下方按钮立即进入游戏大厅</p>
        <a href="http://47.116.203.177:3456/" class="start-btn">开始游戏</a>
    </div>
</body>
</html>
